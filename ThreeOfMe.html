<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STORY | Three of Me</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 2000px;
        }

        #dust-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .header {
            position: absolute;
            top: 8%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: bold;
            margin-bottom: 0.5rem;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .scene {
            width: 100%;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            position: relative;
            z-index: 10;
        }

        .carousel {
            width: 300px;
            height: 420px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: grab;
        }

        .carousel:active {
            cursor: grabbing;
        }

        .story-card {
            position: absolute;
            width: 280px;
            height: 420px;
            left: 10px;
            top: 0;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2.5rem;
            user-select: none;
            backface-visibility: visible;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            cursor: pointer;
            transition: border-color 0.4s, background-color 0.4s, box-shadow 0.4s;
        }

        .story-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 14px;
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.1), transparent);
        }

        .story-card:hover {
            border-color: rgba(255,255,255,0.3);
            background-color: rgba(255,255,255,0.05);
            box-shadow: 0 0 50px rgba(255,255,255,0.08);
        }

        .story-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            line-height: 1.1;
            pointer-events: none;
            transition: transform 0.4s;
        }

        .story-card:hover h2 {
            transform: translateY(-8px);
        }

        .story-card .tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 0.8rem;
            pointer-events: none;
        }

        .story-card .read-btn {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            display: inline-block;
            width: fit-content;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s;
            pointer-events: none;
        }

        .story-card:hover .read-btn {
            background: white;
            color: black;
            border-color: white;
            transform: translateY(-5px);
        }

        .controls {
            position: absolute;
            bottom: 8%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .hint {
            color: rgba(255,255,255,0.3);
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        .home-link {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 50;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            box-shadow: 0 0 0 rgba(255, 255, 255, 0);
        }

        .home-link:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<canvas id="dust-canvas"></canvas>

<a href="index.html" class="home-link">← Back to Home</a>

<div class="header">
    <h1>Three of Me</h1>
    <p>Archive Selection</p>
</div>

<div class="scene">
    <div class="carousel" id="carousel"></div>
</div>

<div class="controls">
    <div class="hint">Swipe or Scroll to Browse</div>
</div>

<script>
    // Added "Reignited." as requested with small note "LOVE." linked to "Reignited.html"
    const stories = [
        { title: "Times Ending.", tag: "Story I - Setup", url: "TimesEnding.html" },
        { title: "Upbringing.", tag: "Story II - Religion", url: "Upbringing.html" },
        { title: "Frozen.", tag: "Story III - Abandonment", url: "Frozen.html" },
        { title: "Normalcy.", tag: "Story IV - Return", url: "Normalcy.html" },
        { title: "Agony.", tag: "Story V - Loss", url: "Agony.html" },
        { title: "Reignited.", tag: "Story VI - Love", url: "Reignited.html" }
    ];

    const carousel = document.getElementById('carousel');
    // Radius of 450px looks exceptionally good with 6 items to give them ample breathing room
    const radius = 450;
    let rotationY = 0;
    let isDragging = false;
    let startX = 0;
    let velocity = 0;
    let dragDistance = 0;

    stories.forEach((story, i) => {
        const card = document.createElement('div');
        card.className = 'story-card';

        const angle = (i / stories.length) * 360;
        card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;

        card.innerHTML = `
            <div class="tag">${story.tag}</div>
            <h2>${story.title}</h2>
            <div class="read-btn">Enter Story</div>
        `;

        card.addEventListener('click', () => {
            if (dragDistance < 10 && Math.abs(velocity) < 0.5) {
                window.location.href = story.url;
            }
        });

        carousel.appendChild(card);
    });

    function updateCarousel() {
        if (!isDragging) {
            velocity *= 0.96;
            rotationY += velocity;
        }

        carousel.style.transform = `rotateY(${rotationY}deg)`;
        requestAnimationFrame(updateCarousel);
    }

    function handleStart(x) {
        isDragging = true;
        startX = x;
        dragDistance = 0;
    }

    function handleMove(currentX) {
        if (!isDragging) return;
        const deltaX = currentX - startX;
        dragDistance += Math.abs(deltaX);
        velocity = deltaX * 0.15;
        rotationY += velocity;
        startX = currentX;
    }

    function handleEnd() {
        isDragging = false;
    }

    window.addEventListener('mousedown', (e) => handleStart(e.clientX));
    window.addEventListener('mousemove', (e) => handleMove(e.clientX));
    window.addEventListener('mouseup', handleEnd);

    window.addEventListener('touchstart', (e) => handleStart(e.touches[0].clientX), {passive: true});
    window.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX), {passive: true});
    window.addEventListener('touchend', handleEnd);

    window.addEventListener('wheel', (e) => {
        velocity += e.deltaY * -0.01;
    }, {passive: true});

    updateCarousel();

    const canvas = document.getElementById('dust-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: null, y: null };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });
    resize();

    window.addEventListener('mousemove', (e) => {
        mouse.x = e.x;
        mouse.y = e.y;
    });

    class Particle {
        constructor() { this.init(); }
        init() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 1.5 + 0.5;
            this.baseX = this.x;
            this.baseY = this.y;
            this.density = (Math.random() * 30) + 1;
            this.speedX = (Math.random() - 0.5) * 0.5;
            this.speedY = (Math.random() - 0.5) * 0.5;
            this.opacity = Math.random() * 0.5 + 0.2;
        }
        draw() {
            ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x > canvas.width) this.x = 0;
            if (this.x < 0) this.x = canvas.width;
            if (this.y > canvas.height) this.y = 0;
            if (this.y < 0) this.y = canvas.height;

            if (mouse.x != null) {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let maxDistance = 0;
                if (distance < maxDistance) {
                    let force = (maxDistance - distance) / maxDistance;
                    this.x -= (dx / distance) * force * 5;
                    this.y -= (dy / distance) * force * 5;
                }
            }
        }
    }

    function initParticles() {
        particles = [];
        const count = (canvas.width * canvas.height) / 1000;
        for (let i = 0; i < count; i++) { particles.push(new Particle()); }
    }

    function animateDust() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animateDust);
    }

    window.onload = function() {
        initParticles();
        animateDust();
    }
</script>

</body>
</html>
