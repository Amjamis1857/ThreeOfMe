<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXTRAS | Three of Me</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
            position: relative;
        }

        #blizzard-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .logo-text {
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 0.9;
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.01); }
        }

        .animated-logo {
            animation: logoFloat 8s ease-in-out infinite;
            text-align: center;
        }

        .sidebar-item {
            padding: 1.25rem 1.5rem;
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: all 0.2s ease;
            color: rgba(255, 255, 255, 0.4);
        }

        .sidebar-item:hover {
            color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.03);
        }

        .sidebar-item.active {
            background: rgba(255, 255, 255, 0.08);
            border-left-color: #fff;
            color: #fff;
        }

        .art-item {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
        }

        .art-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.9;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        .art-item:hover img {
            transform: scale(1.04);
            opacity: 1;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        .disclaimer {
            animation: fadeOut 5s forwards;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #ccc;
        }

        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            max-width: 90vw;
            max-height: 80vh;
            object-fit: contain;
            box-shadow: 0 0 100px rgba(0,0,0,1);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .lightbox-quote {
            margin-top: 2rem;
            font-weight: 200;
            letter-spacing: 0.1em;
            color: #aaa;
            text-align: center;
            max-width: 600px;
            font-style: italic;
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 0px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        .section-content {
            display: none;
        }
        .section-content.active {
            display: block;
        }

        .video-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: #000;
            border: 2px solid #000;
            box-shadow: 0 40px 80px rgba(0,0,0,0.95);
            position: relative;
            aspect-ratio: 1 / 1;
            z-index: 5;
        }

        .video-wrapper {
            position: relative;
            padding-top: 140px;
        }

        @keyframes slither {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            33% { transform: translateX(-10px) rotate(-1deg); }
            66% { transform: translateX(10px) rotate(1deg); }
        }

        @keyframes pulsateWidth {
            0%, 100% { width: 32px; }
            50% { width: 44px; }
        }

        @keyframes gripPulsate {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .string {
            position: absolute;
            top: -100px;
            width: 36px;
            height: 280px;
            background: #000;
            z-index: 2;
            border-radius: 0 0 20px 20px;
            animation: slither 8s ease-in-out infinite, pulsateWidth 5s ease-in-out infinite;
        }

        .string-left {
            left: 18%;
            transform-origin: top center;
        }

        .string-right {
            right: 18%;
            transform-origin: top center;
            animation-delay: -4s;
        }

        .string-joint {
            position: absolute;
            top: 140px;
            width: 60px;
            height: 50px;
            background: #000;
            border-radius: 50%;
            z-index: 3;
            box-shadow: 0 0 30px rgba(0,0,0,1);
            animation: gripPulsate 4s ease-in-out infinite;
        }

        .joint-left {
            left: calc(18% - 12px);
            animation: slither 8s ease-in-out infinite, gripPulsate 4s ease-in-out infinite;
        }
        .joint-right {
            right: calc(18% - 12px);
            animation: slither 8s ease-in-out infinite, gripPulsate 4s ease-in-out infinite;
            animation-delay: -4s, -2s;
        }

        @keyframes containerSway {
            0%, 100% { transform: rotate(0.4deg) translateY(0); }
            50% { transform: rotate(-0.4deg) translateY(12px); }
        }

        .video-container {
            animation: containerSway 8s ease-in-out infinite;
            transform-origin: top center;
        }
    </style>
</head>
<body class="p-4 md:p-10 flex flex-col md:flex-row gap-6 h-screen">

    <canvas id="blizzard-canvas"></canvas>

    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" class="lightbox-content" src="" alt="Enlarged Art">
        <p id="lightbox-quote" class="lightbox-quote"></p>
        <button class="absolute top-8 right-8 text-white/50 hover:text-white uppercase tracking-widest text-xs">Close [ESC]</button>
    </div>

    <div class="glass-panel w-full md:w-72 flex flex-col shrink-0">
        <div class="p-12 border-b border-white/5 flex flex-col items-center justify-center">
            <div class="animated-logo">
                <h1 class="logo-text text-5xl text-white">THREE</h1>
                <h1 class="logo-text text-5xl text-white">OF ME.</h1>
            </div>
            <p class="text-[9px] text-gray-500 mt-6 uppercase tracking-[0.5em]">Extras</p>
        </div>

        <nav class="flex-grow py-6">
            <div class="sidebar-item active" onclick="switchSection('art', this)">
                <span class="text-xs font-light tracking-[0.3em] uppercase">Art Gallery</span>
            </div>
            <div class="sidebar-item" onclick="switchSection('cg', this)">
                <span class="text-xs font-light tracking-[0.3em] uppercase">You'll Be Fine</span>
            </div>
        </nav>

        <div class="p-8 border-t border-white/5">
            <button onclick="window.history.back()" class="text-[10px] text-gray-500 hover:text-white transition-colors uppercase tracking-[0.4em] flex items-center gap-3">
                <span class="text-lg">«</span> Back
            </button>
        </div>
    </div>

    <div class="glass-panel flex-grow overflow-hidden flex flex-col">
        <div class="px-10 py-8 border-b border-white/5 flex justify-between items-end">
            <h3 id="section-title" class="text-2xl font-thin tracking-[0.1em] uppercase">Art Gallery</h3>
            <div id="section-disclaimer" class="disclaimer">Click images for information</div>
        </div>

        <div class="custom-scroll overflow-y-auto flex-grow p-10">
            <div id="art-section" class="section-content active">
                <div id="gallery-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
                </div>
            </div>

            <div id="cg-section" class="section-content">
                <div class="flex flex-col items-center">
                    <div class="video-wrapper w-full max-w-[600px]">
                        <div class="string string-left"></div>
                        <div class="string string-right"></div>
                        <div class="string-joint joint-left"></div>
                        <div class="string-joint joint-right"></div>

                        <div class="video-container">
                            <video controls class="w-full h-full object-cover">
                                <source src="extras/art/CG.mp4" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>
                    </div>

                    <div class="max-w-2xl text-center mt-12">
                        <h4 class="text-xl font-light tracking-widest uppercase mb-4">'You'll be fine!'</h4>
                        <p class="text-sm text-gray-400 leading-relaxed font-light">
                            "You have to admit, he has a good singing voice."
                        </p>
                        <p class="text-[10px] text-white/20 mt-4 uppercase tracking-widest">Format: 1024x1024 / Archival</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const galleryData = [
            { file: 'image2.png', quote: '"A little sketch I did for when Normalcy was coming out. Mainly drew it as an excuse to promote the book series more in Discord servers and stuff if you want me to be honest"' },
            { file: 'image3.png', quote: '"A scrapped image for Amjamis- well, not scrapped per se, but I felt that I could do better. I mainly changed the hair, added the fur back to the boots, and made the eyes a little bigger to fit in a little closer with Arial and MYS."' },
            { file: 'image4.png', quote: '"Another drawing of Amjamis, this was drawn inbetween the one in the frontpage, and the image before this one. This was more closer to the final design, and while I was still trying to figure out how I wanted to shade his hair. (I still have no fucking clue.)"' },
            { file: 'image5.png', quote: '"I can see him."' },
            { file: 'image7.png', quote: '"Sleeping with these chants were hard."'},
            { file: 'image8.png', quote: '"I was not really grasping this new truth, this new.. part, you call it of my life very well at the beginning, but can you really blame me?"'},
            { file: 'image9.png', quote: '"I had no fucking clue how to tell anyone, I mean.. How do you? It is a miracle I made it this far."'},
        ];

        const galleryGrid = document.getElementById('gallery-grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxQuote = document.getElementById('lightbox-quote');

        function switchSection(sectionId, element) {
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.querySelectorAll('.section-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`${sectionId}-section`).classList.add('active');

            const title = document.getElementById('section-title');
            const disclaimer = document.getElementById('section-disclaimer');

            if (sectionId === 'art') {
                title.innerText = 'Art Gallery';
                disclaimer.style.display = 'block';
            } else {
                title.innerText = "You'll be fine!";
                disclaimer.style.display = 'none';
            }
        }

        function openLightbox(src, quote) {
            lightboxImg.src = src;
            lightboxQuote.innerText = quote || "";
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        function loadGallery() {
            galleryGrid.innerHTML = '';
            const shuffled = [...galleryData].sort(() => Math.random() - 0.5);

            shuffled.forEach(item => {
                const container = document.createElement('div');
                container.className = 'art-item group';
                const img = new Image();
                img.src = `extras/art/${item.file}`;
                img.alt = item.file;
                img.onload = () => {
                    container.appendChild(img);
                    galleryGrid.appendChild(container);
                    container.onclick = () => openLightbox(img.src, item.quote);
                };
                img.onerror = () => container.remove();
            });
        }

        const canvas = document.getElementById('blizzard-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.2;
                this.speedX = Math.random() * 3 + 1.5;
                this.speedY = Math.random() * 0.8 + 0.2;
                this.opacity = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = -10;
                if (this.y > canvas.height) this.y = -10;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createParticles() {
            for (let i = 0; i < 200; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        createParticles();
        animate();
        loadGallery();
    </script>
</body>
</html>
